# cargo runs through mr-boxington (mbx), which caches compiled crates across builds.
wrappers = { cargo = { command = "mbx", env = { MBX_CARGO_SHIM_MODE = "1" } } }

[tools]
mr-boxington = "1.30.0"
rust = { version = "1.100.0", components = "rustfmt,clippy", mr_boxington = true }

[env]
# Native libraries come from nx (nix) on Fedora Atomic: libraries live in
# ~/.nix-profile/lib, and link-only pkg-config entries live in dev/pkgconfig.
# triton-engine dlopens libwayland-client/libEGL at runtime, so only
# libxkbcommon needs a real library here — no -devel packages anywhere.
PKG_CONFIG_PATH = "{{config_root}}/dev/pkgconfig:{{env.PKG_CONFIG_PATH | default(value='')}}"
LIBRARY_PATH = "{{env.HOME}}/.nix-profile/lib"
RUST_LOG = "{{env.RUST_LOG | default(value='triton_engine=debug,info')}}"

# ── setup ────────────────────────────────────────────────────────────────────

[tasks.setup]
description = "Install native deps (nx)"
run = "nx add libxkbcommon"

# ── build & checks ───────────────────────────────────────────────────────────

[tasks.build]
description = "Build all crates (debug)"
run = "cargo build"

[tasks.check]
description = "fmt check, clippy (warnings are errors), tests (incl. example + doc tests)"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo test --workspace --all-targets",
  # `--all-targets` skips --doc: gate doc tests explicitly.
  "cargo test --workspace --doc",
]

[tasks.fmt]
description = "Format the workspace"
run = "cargo fmt --all"

[tasks.test]
description = "Run tests"
run = "cargo test --workspace"

[tasks.showcase]
description = "Run the triton-kit showcase example (needs a Wayland session)"
run = "cargo run -p triton-kit --example showcase"

# ── isolated dev session ─────────────────────────────────────────────────────
# Runs the real `triton` shell inside a NESTED niri window: private session bus
# (dbus-run-session), private XDG_RUNTIME_DIR, scratch HOME/XDG dirs, and
# GSETTINGS_BACKEND=memory — never the host session, the real ~/.config/niri,
# or host dconf. `--real-services` is the default here so live niri IPC, owned
# triton/*.kdl generation, and gsettings live-reload all work strictly inside
# target/nested-niri. See dev/nested/session.sh.

[tasks.dev]
description = "Nested niri dev session running the triton shell with real services (isolated)"
run = """
cargo build -p triton
RUNNER="env REPO=$PWD"
if command -v dbus-run-session >/dev/null 2>&1; then
  RUNNER="env REPO=$PWD TRITON_NESTED_PRIVATE_BUS=1 dbus-run-session --"
fi
$RUNNER sh dev/nested/session.sh "$PWD/target/debug/triton" --real-services
"""

[tasks."dev:showcase"]
description = "Nested niri dev session running the triton-kit showcase gallery (isolated)"
run = """
cargo build -p triton-kit --example showcase
RUNNER="env REPO=$PWD"
if command -v dbus-run-session >/dev/null 2>&1; then
  RUNNER="env REPO=$PWD TRITON_NESTED_PRIVATE_BUS=1 dbus-run-session --"
fi
$RUNNER sh dev/nested/session.sh "$PWD/target/debug/examples/showcase"
"""

[tasks.msg]
description = "Send `triton msg` to the running nested session's private socket"
run = """
SOCKET="$PWD/target/nested-niri/runtime/triton.sock"
if [ ! -S "$SOCKET" ]; then
  echo "mise run msg: no triton socket at $SOCKET — start the dev session first" >&2
  exit 1
fi
cargo run -q -p triton -- msg --socket "$SOCKET"
"""

[tasks.snap]
description = "Headless offscreen PNG snapshot of triton surfaces (e.g. `mise run snap -- target/snap --surface all`)"
run = "cargo run -q -p triton -- --snap"

# ── assets ───────────────────────────────────────────────────────────────────

[tasks.fonts]
description = "Rebuild crates/triton-design/fonts from icons.txt (container with fonttools)"
run = """
podman build -q -t localhost/triton-fonts:latest dev/fonts >/dev/null
mkdir -p target/fonts-src
podman run --rm --security-opt label=disable -v "$PWD:/work" -w /work \
  -v "$(readlink -f target/fonts-src):/cache" -e FONTS_CACHE=/cache \
  localhost/triton-fonts:latest python3 -I dev/fonts/build.py
"""

# ── board rendering ─────────────────────────────────────────────────────────
# dev/boards/: headless Chromium renders a design board (.dc.html) at 2x for
# visual reference. The preview/child shells are gone with the iced crates —
# a new isolated runner for triton-engine surfaces lands with the first panel.

[tasks."boards:image"]
description = "Build the board-render container (headless Chromium)"
run = "podman build -t localhost/triton-boards:latest dev/boards"
