[package]
name = "triton-ui"
version = "0.1.0"
description = "Triton's component set on iced, shared by every surface."
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

# Widgets and the tiny-skia renderer only (the shell adds wgpu, ADR-0007): no winit,
# no compositor, so components are built and snapshot-tested without a compositor.
[dependencies]
# `advanced`: custom theme classes (`.class(..)`) are behind it.
iced_core = { workspace = true, features = ["advanced"] }
# `wayland`: softbuffer (how tiny-skia presents) needs a backend to compile.
iced_renderer = { workspace = true, features = ["tiny-skia", "wayland"] }
iced_widget = { workspace = true, features = ["advanced", "canvas"] }
triton-design.workspace = true

[dev-dependencies]
iced_test.workspace = true
