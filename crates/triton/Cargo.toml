[package]
name = "triton"
version = "0.1.0"
description = "The Triton shell: bar, panels and surfaces on niri."
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { workspace = true, features = ["clock"] }
iced_core = { workspace = true, features = ["advanced"] }
# Without a backend feature iced uses its null executor: subscriptions never run.
iced_futures = { workspace = true, features = ["tokio"] }
iced_runtime.workspace = true
iced_layershell.workspace = true
# wgpu first, tiny-skia as the fallback when no GPU adapter works (ADR-0007).
# iced_renderer 0.14 gates the wgpu renderer on `wgpu-bare`; `wgpu` adds its
# defaults. `wayland` is softbuffer's backend, for the fallback.
iced_renderer = { workspace = true, features = [
  "wgpu-bare",
  "wgpu",
  "tiny-skia",
  "wayland",
  "geometry",
] }
iced_widget = { workspace = true, features = ["advanced", "canvas"] }
niri-ipc.workspace = true
# `after` sleeps; iced_futures' tokio executor provides the runtime.
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter", "ansi"] }
triton-design.workspace = true
triton-ui.workspace = true
# Status services read UPower and NetworkManager over D-Bus; `block_on` on the
# watcher threads needs no async runtime of ours (zruntime's helper thread).
zbus = { version = "6", default-features = false, features = [
  "default-rt",
  "proxy",
  "tracing",
] }
# Pins only (see the workspace manifest).
winit-common.workspace = true
winit-core.workspace = true

[dev-dependencies]
iced_sessionlock.workspace = true
tempfile.workspace = true

