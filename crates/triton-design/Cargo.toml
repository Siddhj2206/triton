[package]
name = "triton-design"
version = "0.1.0"
description = "Material 3 Futura as code: color roles, materials, shape, type, springs and the wave."
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

# Pure on purpose: zero runtime dependencies, so it builds in milliseconds and
# every token, spring and path is testable without Wayland or a GPU.
[dependencies]

[dev-dependencies]
serde_json.workspace = true
# The parser fontdb uses, to verify the embedded font files match our type scale.
ttf-parser = "0.25"

[build-dependencies]
serde_json.workspace = true
