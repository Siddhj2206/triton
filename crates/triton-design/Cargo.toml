[package]
name = "triton-design"
version = "0.1.0"
description = "Material 3 Futura as code: color roles, materials, shape, type, springs and the wave."
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

# Pure on purpose: iced_core only (no renderer, no widgets), so it builds fast and
# every token, spring and path is testable without Wayland.
[dependencies]
iced_core.workspace = true

[dev-dependencies]
serde_json.workspace = true
# The parser fontdb uses, to check the font files the way iced will read them.
ttf-parser = "0.25"

[build-dependencies]
serde_json.workspace = true
