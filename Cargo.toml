[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/triton-engine", "crates/triton-kit", "crates/triton"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.100" # equals mise.toml
publish = false

[workspace.dependencies]
# internal
triton-design = { path = "crates/triton-design" }
triton-engine = { path = "crates/triton-engine" }
triton-kit = { path = "crates/triton-kit" }
# external (members re-enable the features they need)
anyhow = { version = "1", default-features = false }
image = { version = "0.25", default-features = false }
cosmic-text = { version = "0.15", default-features = false }
etagere = { version = "0.2", default-features = false }
glow = { version = "0.16", default-features = false }
khronos-egl = { version = "6.0", default-features = false }
libloading = "0.9"
serde = { version = "1", default-features = false }
serde_json = "1.0.154"
smithay-client-toolkit = { version = "0.21", default-features = false }
taffy = { version = "0.15", default-features = false }
tempfile = "3"
thiserror = "2"
tracing = "0.1.44"
wayland-client = { version = "0.31", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
unreadable_literal = "allow" # hex colours read better unseparated
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"
await_holding_lock = "deny"
large_futures = "warn"
disallowed_methods = "deny"

# Dependencies build optimised even in dev, so the shell is smooth while iterating.
[profile.dev.package."*"]
opt-level = 2
